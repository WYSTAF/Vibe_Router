[package]
name = "vr-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TOML + env configuration for Vibe Router, with validation and hot reload."
license = "MIT"
publish = false

[features]
# Hot reload of the config file (off by default; the server enables it).
watch = ["tokio/sync"]

[dependencies]
vr-core = { path = "../vr-core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
thiserror = "1"
parking_lot = "0.12"
tracing = "0.1"

[dependencies.tokio]
version = "1"
default-features = false
optional = true
