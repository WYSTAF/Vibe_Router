[package]
name = "vibe-router-routing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Resolution, selection, retry and failover over an ordered candidate list."
license = "Apache-2.0"
publish = false

[dependencies]
vibe-router-core = { path = "../vibe-router-core" }
vibe-router-health = { path = "../vibe-router-health" }

serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
