[package]
name = "vr-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Command-line interface for Vibe Router."
license = "MIT"
publish = false

[dependencies]
vr-core = { path = "../vr-core" }
vr-config = { path = "../vr-config" }
vr-providers = { path = "../vr-providers" }
vr-server = { path = "../vr-server" }
vr-storage = { path = "../vr-storage" }
vr-health = { path = "../vr-health" }

clap = { version = "4", default-features = false, features = [
    "std", "help", "usage", "error-context", "derive",
] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt", "env-filter", "smallvec", "std",
] }
serde_json.workspace = true
anyhow = "1"
