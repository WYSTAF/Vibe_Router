[package]
name = "vibe-router-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "HTTP server: OpenAI-compatible /v1/* routes, admin API, embedded UI."
license = "MIT"
publish = false

[dependencies]
vibe-router-core = { path = "../vibe-router-core" }
vibe-router-config = { path = "../vibe-router-config" }
vibe-router-providers = { path = "../vibe-router-providers" }
vibe-router-health = { path = "../vibe-router-health" }
vibe-router-routing = { path = "../vibe-router-routing" }
vibe-router-translate = { path = "../vibe-router-translate" }
vibe-router-storage = { path = "../vibe-router-storage" }
vibe-router-cache = { path = "../vibe-router-cache" }
vibe-router-ui = { path = "../vibe-router-ui" }

axum = { version = "0.7", default-features = false, features = [
    "http1", "json", "query", "tokio",
] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread", "net", "signal", "time", "sync", "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls",
] }
vibe-router-providers = { path = "../vibe-router-providers", features = ["test-mock"] }
tokio = { version = "1", features = ["full"] }
