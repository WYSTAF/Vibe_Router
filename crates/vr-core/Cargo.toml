[package]
name = "vr-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Core vocabulary for Vibe Router: Provider trait, Model, Combo, Candidate."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync"] }
