[package]
name = "vibe-router-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TOML + env configuration for Vibe Router, with validation and error classification."
license = "Apache-2.0"
publish = false

[dependencies]
vibe-router-core = { path = "../vibe-router-core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
thiserror = "1"
parking_lot = "0.12"
