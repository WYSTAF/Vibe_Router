[package]
name = "vr-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Usage logging and state persistence behind an isolated trait."
license = "MIT"
publish = false

[dependencies]
vr-core = { path = "../vr-core" }

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time"] }
parking_lot = "0.12"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.31", features = ["bundled"] }
