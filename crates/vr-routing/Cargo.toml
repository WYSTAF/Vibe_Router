[package]
name = "vr-routing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Resolution, selection, retry and failover over an ordered candidate list."
license = "MIT"
publish = false

[dependencies]
vr-core = { path = "../vr-core" }
vr-health = { path = "../vr-health" }

serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
