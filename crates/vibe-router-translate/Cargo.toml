[package]
name = "vibe-router-translate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Wire-format translation through a canonical representation."
license = "Apache-2.0"
publish = false

[dependencies]
vibe-router-core = { path = "../vibe-router-core" }

serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
bytes = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }
tracing = "0.1"
