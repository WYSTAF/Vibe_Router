# Vibe Router — Configuration
# Generic public-provider examples. Copy to vibe-router.local.toml for private
# deployment details (that file is git-ignored). Secrets use env: references and
# are resolved at request time; never commit literal keys.

[server]
host = "127.0.0.1"
port = 20128
# Optional API keys required from clients on `Authorization: Bearer <key>`.
# Leave empty for open access on loopback / a trusted private network.
api_keys = []
# Or read acceptable keys from environment variable names:
# api_key_env = ["VIBE_ROUTER_API_KEY"]
log_dir = "logs"
# Allow runtime-authored providers/proxies to target loopback/private networks
# (e.g. local Ollama or Vibe-Local). Default false blocks SSRF via the admin API.
allow_local_upstreams = true
# Auto-discover host environment proxies and local VPN ports at startup.
auto_discover_proxies = false
# Auto-discover local "Vibe Local" worker nodes (this PC + LAN pocket workers).
# Scans UDP 20131 (loopback + broadcast) and falls back to HTTP 127.0.0.1:20129,
# registering responding nodes as passthrough OpenAI providers. Built-in default
# is true; disabled here so the example config never probes the network. Set
# VIBE_LOCAL_TOKEN in the environment to authenticate against secured nodes.
auto_discover_local = false

[storage]
# SQLite database for usage metrics and runtime-authored state.
# An empty path "" uses an in-memory store (nothing persists across restarts).
sqlite_path = "vibe-router.db"

[cache]
enabled = true
# Tune for small VPS instances (1-2 GiB): e.g. 16 or 32 MB.
max_memory_mb = 32
ttl_seconds = 1800
stream_cache = false

[strategy]
request_budget_ms = 180000
connect_timeout_ms = 60000
first_chunk_timeout_ms = 180000
stall_timeout_ms = 300000

[strategy.retry.by_status.502]
attempts = 2
delay_ms = 1500

[strategy.retry.by_status.503]
attempts = 1
delay_ms = 2000

[limits.cooldown]
transient_ms = 30000
max_ms = 1800000

[limits.backoff]
base_ms = 2000
max_ms = 300000
max_levels = 15

# ============================================================================
# Upstream Providers (generic public examples)
# ============================================================================

[[providers]]
id = "openai"
display_name = "OpenAI"
base_url = "https://api.openai.com/v1/chat/completions"
auth = { scheme = "Bearer", secret = "env:OPENAI_API_KEY" }
models = [
    { id = "gpt-4o", context = 128000 },
    { id = "gpt-4o-mini", context = 128000 }
]

[[providers]]
id = "anthropic"
display_name = "Anthropic"
base_url = "https://api.anthropic.com/v1/messages"
format = "anthropic"
auth = { scheme = { Custom = { header_name = "x-api-key" } }, secret = "env:ANTHROPIC_API_KEY" }
headers = [["anthropic-version", "2023-06-01"]]
models = [
    { id = "claude-3-5-sonnet", context = 200000 },
    { id = "claude-3-5-haiku", context = 200000 }
]

[[providers]]
id = "gemini"
display_name = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
auth = { scheme = "Bearer", secret = "env:GEMINI_API_KEY" }
models = [
    { id = "gemini-2.0-flash", context = 1000000 },
    { id = "gemini-1.5-pro", context = 2000000 }
]

[[providers]]
id = "openrouter"
display_name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1/chat/completions"
auth = { scheme = "Bearer", secret = "env:OPENROUTER_API_KEY" }
passthrough = true
models = [
    { id = "meta-llama/llama-3.3-70b-instruct", context = 131072 },
    { id = "deepseek/deepseek-chat", context = 64000 }
]

[[providers]]
id = "ollama"
display_name = "Local Ollama"
base_url = "http://localhost:11434/v1/chat/completions"
auth = { secret = "" }
passthrough = true
models = [
    { id = "llama3.2" },
    { id = "qwen2.5-coder:7b" }
]

[[providers]]
id = "vibe-local"
display_name = "Vibe-Local"
base_url = "http://127.0.0.1:20129/v1/chat/completions"
auth = { secret = "" }
passthrough = true
models = []

# ============================================================================
# Model Combos (ordered fallback chains: subscription -> cheap -> free)
# ============================================================================

[[combos]]
name = "fast-cheap"
description = "Fast cloud first, local fallback"
models = [
    "openai/gpt-4o-mini",
    "gemini/gemini-2.0-flash",
    "openrouter/meta-llama/llama-3.3-70b-instruct",
    "ollama/llama3.2"
]

[[combos]]
name = "coder"
description = "Coding chain with local fallback"
models = [
    "anthropic/claude-3-5-sonnet",
    "openrouter/deepseek/deepseek-chat",
    "ollama/qwen2.5-coder:7b"
]

# ============================================================================
# Role Assignments (orchestration roles, e.g. for Vibe Assembly)
# ============================================================================

[roles.boss]
model = "anthropic/claude-3-5-sonnet"
class = "flagship"
context_window = 200000

[roles.code]
model = "coder"
class = "coder"
context_window = 65536
recommended_ticket_size = "S"

[roles.debug]
model = "openrouter/deepseek/deepseek-chat"
class = "reasoner"

[roles.chat]
model = "fast-cheap"
class = "fast"

# ============================================================================
# Error Classification Rules (top-to-bottom, first match wins).
# Custom rules merge ahead of the built-in defaults. 401/403 are key faults:
# the transport rotates to the next healthy key and cools the offending key,
# so they must NOT cool the whole candidate (fallback = false).
# ============================================================================

[[error_rules]]
match = { Text = "rate limit" }
fallback = true
backoff = true

[[error_rules]]
match = { Text = "quota exceeded" }
fallback = true
backoff = true

[[error_rules]]
match = { Status = 429 }
fallback = true
backoff = true

[[error_rules]]
match = { Status = 503 }
fallback = true
cooldown_ms = 5000

[[error_rules]]
match = { Status = 502 }
fallback = true
cooldown_ms = 3000